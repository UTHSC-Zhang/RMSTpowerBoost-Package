name: Upload coverage reports to Codecov

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  upload-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Dependencies come from DESCRIPTION below, so stop .Rprofile from
      # activating the renv project library, which is empty on the runner.
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      # Codecov discards a report whose timestamp is more than 12 hours old, so
      # re-uploading a committed coverage/cobertura.xml leaves every new commit
      # at 0%. Measure coverage fresh for each commit instead.
      # Run only the testthat suite. tests/ also holds a manual validation
      # script (excluded from R CMD check by .Rbuildignore) that needs
      # truncnorm and devtools; covr does not read .Rbuildignore and would
      # run it too.
      - name: Generate coverage report
        shell: Rscript {0}
        run: |
          dir.create("coverage", showWarnings = FALSE)
          cov <- covr::package_coverage(
            type = "none",
            code = "testthat::test_package('RMSTpowerBoost')",
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov, filename = "coverage/cobertura.xml")
          message(sprintf("Line coverage: %.2f%%", covr::percent_coverage(cov)))

      - name: Check coverage report
        id: coverage_file
        run: |
          if [ -f coverage/cobertura.xml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Coverage file found: coverage/cobertura.xml"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "coverage/cobertura.xml was not generated."
            exit 1
          fi

      - name: Coverage diagnostics
        if: always()
        run: |
          echo "## Coverage diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- found output: \`${{ steps.coverage_file.outputs.found }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Directory listing:" >> "$GITHUB_STEP_SUMMARY"
          ls -la coverage >> "$GITHUB_STEP_SUMMARY" 2>&1 || echo "coverage directory not present" >> "$GITHUB_STEP_SUMMARY"

      - name: Normalize Cobertura paths
        if: steps.coverage_file.outputs.found == 'true'
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          import xml.etree.ElementTree as ET

          report = "coverage/cobertura.xml"
          tree = ET.parse(report)
          root = tree.getroot()

          # Remove source roots so filenames are interpreted as repo-relative.
          sources = root.find(".//sources")
          if sources is not None:
              root.remove(sources)

          missing = set()
          classes = root.findall(".//class")
          if not classes:
              print("ERROR: No <class> entries found in cobertura.xml after normalization.")
              sys.exit(1)

          for cls in classes:
              fn = (cls.get("filename") or "").replace("\\", "/")
              fn = re.sub(
                  r"^(?:[A-Za-z]:)?/.*/RMSTpowerBoost-Package/",
                  "",
                  fn,
                  flags=re.IGNORECASE,
              )
              fn = fn.lstrip("./")
              cls.set("filename", fn)
              if fn and not os.path.exists(fn):
                  missing.add(fn)

          tree.write(report, encoding="utf-8", xml_declaration=True)
          print(f"classes={len(classes)}")
          print(f"missing_files={len(missing)}")
          for item in sorted(missing):
              print(f"missing:{item}")
          if missing:
              print("ERROR: Cobertura contains filenames that do not exist in the repository.")
              sys.exit(1)
          PY

      - name: Coverage mapping diagnostics
        if: steps.coverage_file.outputs.found == 'true'
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Post-normalization XML preview:" >> "$GITHUB_STEP_SUMMARY"
          head -n 40 coverage/cobertura.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to Codecov
        if: steps.coverage_file.outputs.found == 'true'
        uses: codecov/codecov-action@v7
        with:
          slug: UTHSC-Zhang/RMSTpowerBoost-Package
          files: coverage/cobertura.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
          verbose: true
